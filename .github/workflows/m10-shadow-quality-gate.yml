name: M10 Shadow Quality Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m10-shadow-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  m10-shadow-quality-gate:
    name: m10-shadow-quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned engineering-quality controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: jonaslvhaocheng-ops/engineering-quality-skills
          ref: ecab972eb859044bb7545d43b6da8114b74b6fec
          path: .engineering-quality/controller
          persist-credentials: false

      - name: Install Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          version: "0.11.14"

      - name: Restore locked environment
        run: uv sync --frozen --extra dev

      - name: Verify quality ledgers and source bindings
        run: >-
          uv run python
          .engineering-quality/controller/scripts/quality/quality_ledger.py
          check-ci
          --pre-merge
          --root .engineering-quality/changes
          --repo .

      - name: Run static checks
        run: uv run ruff check src tests scripts --exclude scripts/vendor

      - name: Run complete test suite
        run: uv run pytest -q

      - name: Enforce exact M10 line and branch coverage
        run: >-
          uv run pytest -q
          tests/test_m10_production.py
          tests/test_m10_edge_coverage.py
          --cov=src/qlib_peerlite/production
          --cov-branch
          --cov-fail-under=100

      - name: Verify live execution remains absent
        run: >-
          uv run pytest -q
          tests/test_m10_production.py::test_cli_success_and_live_rejection
          tests/test_m10_production.py::test_terminal_cannot_self_authorize_live
