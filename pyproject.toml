[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qlib-peerlite"
version = "0.1.0"
description = "Auditable Qlib-compatible PeerLite cross-sectional equity research framework"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Proprietary research code" }
authors = [{ name = "Jonas Research" }]
dependencies = [
  "lightgbm==4.6.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<23",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0.2,<7",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch==2.7.1",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
qlib = ["pyqlib==0.9.7"]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
qlib-peerlite = "qlib_peerlite.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/qlib_peerlite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "qlib: requires the optional pyqlib dependency",
  "slow: longer-running deterministic test",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

